version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: palacio-motors-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: palacio_motors
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    container_name: palacio-motors-app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://admin:password123@postgres:5432/palacio_motors
      - WATCHPACK_POLLING=true # Use polling for better hot reload on Windows
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres

volumes:
  postgres_data:
